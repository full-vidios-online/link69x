    /* ===== রিসেট ও বেসিক ===== */
    * {
      box-sizing: border-box;
      margin: 0;
    }

    .mm-page {
      width: 100%;
      min-height: 100vh;
      background: linear-gradient(180deg, #050505, #0d0d0d);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mm-box {
      width: 100%;
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    /* ===== ডেকোরেটিভ লাইন (লাল) ===== */
    .mm-line {
      width: 160px;
      height: 3px;
      margin: 0 auto 22px;
      border-radius: 20px;
      background: linear-gradient(90deg, transparent, #ff1744, transparent);
    }

    /* ===== ভিডিও প্লেয়ার ===== */
    .mm-player {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      border: 1px solid #3a3a3a;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75),
                  inset 0 0 30px rgba(255, 255, 255, 0.025);
    }

    .mm-player::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.025), transparent 60%);
      pointer-events: none;
    }

    /* ===== ব্যাজ (লাইভ + ভিউ) ===== */
    .mm-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 4;
      display: flex;
      gap: 4px;
    }

    .mm-badge {
      padding: 3px 5px;
      border-radius: 3px;
      font-size: 7px;
      line-height: 1;
      font-weight: 700;
      background: #ff1744;
      color: #fff;
    }

    .mm-views {
      background: rgba(0, 0, 0, 0.72);
    }

    /* ===== লোডিং স্পিনার ===== */
    .mm-loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 8;
      text-align: center;
    }

    .mm-spinner {
      width: 44px;
      height: 44px;
      margin: auto;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: #ff1744;
      border-radius: 50%;
      animation: mmSpin 0.8s linear infinite;
    }

    .mm-loading-text {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
    }

    @keyframes mmSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== প্লে বাটন (লাল) ===== */
    .mm-watch {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      width: 76px;
      height: 76px;
      min-width: 76px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background: linear-gradient(135deg, #ff1744, #d50032);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5),
                  0 8px 30px rgba(255, 23, 68, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: mmPlayIn 0.35s ease-out;
    }

    .mm-play-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding-left: 4px;
      font-size: 28px;
      line-height: 1;
      color: #fff;
    }

    .mm-watch:hover {
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55),
                  0 10px 40px rgba(255, 23, 68, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .mm-watch:active {
      transform: translate(-50%, -50%) scale(0.94);
    }

    @keyframes mmPlayIn {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.65);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ===== কন্ট্রোল বার ===== */
    .mm-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 52px;
      padding: 0 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.98), rgba(0, 0, 0, 0.65));
      z-index: 10;
    }

    .mm-control {
      width: 25px;
      height: 30px;
      padding: 0;
      border: 0;
      background: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .mm-control:hover {
      opacity: 0.7;
    }

    .mm-control svg {
      width: 19px;
      height: 19px;
      fill: #fff;
      stroke: #fff;
      stroke-width: 1.5;
    }

    /* ===== লাইভ ডট ===== */
    .mm-live-control {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .mm-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff1744;
      box-shadow: 0 0 8px rgba(255, 23, 68, 0.7);
    }

    /* ===== প্রোগ্রেস বার ===== */
    .mm-progress {
      flex: 1;
      height: 4px;
      min-width: 25px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .mm-progress-fill {
      width: 3%;
      height: 100%;
      background: #ff1744;
    }

    /* ===== এইচডি বাটন ===== */
    .mm-hd {
      border: 0;
      background: #ff1744;
      color: #fff;
      padding: 4px 7px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 800;
    }

    /* ===== ইনফো টেক্সট ===== */
    .mm-info {
      margin: 18px auto 20px;
      max-width: 700px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ===== কন্টিনিউ বাটন ===== */
    .mm-continue {
      width: 100%;
      max-width: 320px;
      min-height: 52px;
      border: 0;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff1744, #d50032);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 23, 68, 0.28);
      transition: 0.2s;
    }

    .mm-continue:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(255, 23, 68, 0.38);
    }

    /* ===== নিচের লাইভ টেক্সট ===== */
    .mm-live {
      margin-top: 16px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .mm-live::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #ff1744;
    }

    /* ===== ফুলস্ক্রিন ওভাররাইড ===== */
    .mm-player:fullscreen {
      border-radius: 0;

    }

    /* ===== মোবাইল রেসপন্সিভ ===== */

      .mm-spinner { width: 34px; height: 34px; border-width: 3px; }
      .mm-loading-text { font-size: 10px; }
      .mm-watch { width: 62px; height: 62px; min-width: 62px; }
      .mm-play-icon { font-size: 23px; padding-left: 3px; }
      .mm-controls { height: 42px; padding: 0 7px; gap: 5px; }
      .mm-control { width: 19px; height: 25px; }
      .mm-control svg { width: 15px; height: 15px; }
      .mm-live-control { font-size: 8px; gap: 3px; }
      .mm-live-dot { width: 5px; height: 5px; }
      .mm-hd { font-size: 7px; padding: 3px 5px; }
      .mm-info { margin-top: 14px; font-size: 13px; }
      .mm-continue { min-height: 48px; max-width: 290px; font-size: 14px; }
    }

    @media (max-width: 380px) {
      .mm-live-control { display: none; }
      .mm-controls { gap: 4px; }
    }
  </style>
</head>

<script>
  (function() {
    // ===== আপনার ডেস্টিনেশন লিংক (এখানে পরিবর্তন করুন) =====
    var DESTINATION = "https://vip.mixclips.top/mix44vip/?utm_source=Saim&utm_medium=parves";

    // ===== ডম এলিমেন্ট =====
    var loading = document.getElementById("mmLoading");
    var watch = document.getElementById("mmWatch");
    var continueBtn = document.getElementById("mmContinue");
    var fullscreenBtn = document.getElementById("mmFullscreen");
    var player = document.getElementById("mmPlayer");

    // ===== ১ সেকেন্ড লোডিং সিমুলেশন =====
    setTimeout(function() {
      if (loading) loading.style.display = "none";
      if (watch) watch.style.display = "block";
    }, 1000);

    // ===== রিডাইরেক্ট ফাংশন =====
    function goToLink() {
      window.location.href = DESTINATION;
    }

    // ===== ক্লিক ইভেন্ট =====
    if (watch) watch.addEventListener("click", goToLink);
    if (continueBtn) continueBtn.addEventListener("click", goToLink);

    // ===== ফুলস্ক্রিন টগল =====
    if (fullscreenBtn && player) {
      fullscreenBtn.addEventListener("click", function() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (player.requestFullscreen) {
          player.requestFullscreen();
        }
      });
    }
  })();
</script>
